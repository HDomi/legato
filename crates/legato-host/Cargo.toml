[package]
name = "legato-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
legato-core = { path = "../legato-core" }
anyhow.workspace = true
tokio.workspace = true
quinn.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
openh264.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
if-addrs = "0.13"
sha2.workspace = true
hex.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_System_Power",
    "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_RemoteDesktop",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows-service = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "11"
core-graphics = { version = "0.25", features = ["highsierra"] }
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSRunningApplication"] }
