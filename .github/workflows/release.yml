# 버전 태그(vX.Y.Z)를 푸시하면 Mac·Windows 앱을 빌드해서 GitHub 릴리스로 올린다 (Vibrato 와 같은 방식).
# 릴리스에는 DMG(Mac 설치), zip(앱 안 업데이터용), EXE(Windows 설치), SHA256SUMS.txt 가 들어간다.
# Mac 은 Secrets 의 자체 서명 인증서로 서명한다 (MACOS_CERT_P12_BASE64, MACOS_CERT_PASSWORD).
# Actions 탭에서 수동 실행(workflow_dispatch)하면 릴리스를 만들지 않고 빌드 결과만 아티팩트로 남긴다 (시험용).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 기본은 읽기만. 릴리스를 만드는 publish 잡만 쓰기 권한을 받는다.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  mac:
    # apple-metal(ScreenCaptureKit 바인딩)이 macOS 26 SDK API 를 써서 Xcode 26 이상 러너가 필요하다.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          want="v$(node -p 'require("./app/src-tauri/tauri.conf.json").version')"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "::error::태그 $GITHUB_REF_NAME 인데 tauri.conf.json 은 $want"; exit 1; }

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      # 태그 릴리스는 반드시 고정 인증서로 서명한다. ad-hoc 으로 대신하면 사용자 Mac 의 화면 기록 · 손쉬운 사용
      # 권한이 업데이트마다 초기화되고, 앱 안 업데이터의 서명 확인도 약해진다.
      - name: Require signing certificate
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12_BASE64" ] || [ -z "$MACOS_CERT_PASSWORD" ]; then
            echo "::error::MACOS_CERT_P12_BASE64 / MACOS_CERT_PASSWORD 시크릿이 없습니다. scripts/make-signing-cert.sh 결과를 레포 Secrets 에 등록해 주세요."
            exit 1
          fi

      # 로컬과 같은 스크립트로 테스트 · 빌드 · 서명 · DMG · zip 을 만든다.
      - name: Build, sign, package
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: scripts/build-mac-release.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac
          path: out/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build installer
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          npx tauri build --bundles nsis

      - name: Collect
        shell: bash
        run: |
          mkdir -p out
          cp target/release/bundle/nsis/*-setup.exe out/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: out/*
          if-no-files-found: error

  publish:
    needs: [mac, windows]
    # 태그로 실행됐을 때만 릴리스를 만든다.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 릴리스 노트: 주석 태그 메시지, 없으면 자동 생성.
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.md
          if [ -s notes.md ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "Legato $GITHUB_REF_NAME" --verify-tag "${notes[@]}"
