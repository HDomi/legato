# main 푸시·PR 마다 Mac·Windows 에서 Rust 테스트와 프론트 빌드를 돌린다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        # macOS 는 Xcode 26 이상 필요 (apple-metal 이 macOS 26 SDK API 사용).
        os: [macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # 기본 멤버(core, host, viewer)만. Tauri 앱은 아래 app 작업에서 빌드한다.
      # 출력은 파일로도 남겨 실패하면 오류 줄을 실행 요약(로그인 없이 보이는 페이지)에 적는다.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee ci-test.log
      - name: Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked -- -D warnings 2>&1 | tee ci-clippy.log
      - name: Failure summary
        if: failure()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.os }} 실패 (오류 부분)"
            echo '```'
            grep -hE -A14 '^(error|warning)(\[|:)|panicked|FAILED' ci-test.log ci-clippy.log 2>/dev/null | head -400
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  app:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Build app bundle
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          npx tauri build --bundles app 2>&1 | tee ../ci-app.log
      - name: Failure summary
        if: failure()
        shell: bash
        run: |
          {
            echo "### app 실패 (오류 부분)"
            echo '```'
            grep -hE -A14 '^(error|warning)(\[|:)|panicked|Error' ci-app.log 2>/dev/null | head -400
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
