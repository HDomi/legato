# main 푸시·PR 마다 Mac·Windows 에서 Rust 테스트와 프론트 빌드를 돌린다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        # macOS 는 Xcode 26 이상 필요 (apple-metal 이 macOS 26 SDK API 사용).
        os: [macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # 기본 멤버(core, host, viewer)만. Tauri 앱은 아래 app 작업에서 빌드한다.
      # 출력은 파일로도 남겨 실패하면 오류 줄을 실행 요약(로그인 없이 보이는 페이지)에 적는다.
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --locked 2>&1 | tee ci-test.log
      - name: Clippy
        shell: bash
        run: |
          set -o pipefail
          cargo clippy --locked --message-format=short -- -D warnings 2>&1 | tee ci-clippy.log
      # 로그는 로그인해야 보이지만 annotation 은 공개 페이지에 보인다. 실패한 로그 끝부분을 줄마다 annotation 으로 남긴다.
      - name: Failure summary
        if: failure()
        shell: bash
        run: |
          for f in ci-clippy.log ci-test.log; do
            [ -s "$f" ] || continue
            # annotation 은 단계당 10개까지라 한 개에 여러 줄(%0A)로 담는다.
            msg=$(tail -n 40 "$f" | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$f 끝부분::$msg"
            # 로그 전체에서 원인이 될 만한 줄만 따로 모은다.
            hits=$(grep -iE 'error|overflow|panicked|STATUS_|memory|signal' "$f" | tr -d '\r' | head -n 40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [ -n "$hits" ] && echo "::error title=$f 오류 줄::$hits"
          done

  app:
    strategy:
      fail-fast: false
      matrix:
        # Windows 도 빌드한다 (앱의 Windows 전용 코드: 서비스 설치 등).
        include:
          - os: macos-26
            bundles: app
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Build app bundle
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          npx tauri build --bundles ${{ matrix.bundles }} 2>&1 | tee ../ci-app.log
      - name: Failure summary
        if: failure()
        shell: bash
        run: |
          if [ -s ci-app.log ]; then
            msg=$(tail -n 40 ci-app.log | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=app::$msg"
          fi
